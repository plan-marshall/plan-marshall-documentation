# The required check of this repository: every link and anchor inside doc/ resolves, and no requirement or watch
# identifier is referenced without being defined. It runs for pull requests and for the merge queue, which a
# review bot's check cannot serve.
name: Links

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and traceability
        run: |
          python3 .claude/skills/doc-review/scripts/trace.py | tee trace.txt
          grep -qx "BROKEN LINKS 0" trace.txt || { echo "::error::broken links or anchors, see the list above"; exit 1; }
          grep -qx "REFERENCED BUT UNDEFINED WATCH IDS \[\]" trace.txt || { echo "::error::a watch identifier is referenced but not defined"; exit 1; }
          grep -qx "UNDEFINED REQ IDS REFERENCED \[\]" trace.txt || { echo "::error::a requirement identifier is referenced but not defined"; exit 1; }
